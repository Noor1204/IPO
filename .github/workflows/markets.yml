name: Market data (Mutual Fund, holidays, corporate actions)

# Official data for the Mutual Fund section (AMFI NAV and returns),
# plus NSE's trading-holiday list (data/market/holidays.json: calendar, "market closed today" banner).
# Each script keeps the last good files when a source is down or not published yet, and only writes new files when the date moves forward.
# A commit here makes the "Refresh data and publish site" workflow rebuild and publish the site.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/markets.yml", "pipeline/mf.mjs", "pipeline/holidays.mjs", "pipeline/actions.mjs"]

permissions: {}

concurrency:
  group: markets
  cancel-in-progress: false

jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mutual funds (AMFI)
        continue-on-error: true
        timeout-minutes: 12
        run: node pipeline/mf.mjs
      - name: Market holidays (NSE trading-holiday list)
        continue-on-error: true
        timeout-minutes: 3
        run: node pipeline/holidays.mjs
      - name: "Corporate actions (NSE - rights, buyback, bonus, split, dividend)"
        continue-on-error: true
        timeout-minutes: 5
        run: node pipeline/actions.mjs
      - name: Validate before committing
        run: node pipeline/validate.mjs
      - name: Commit
        run: |
          git config user.name "trendy-ipo-bot"
          git config user.email "trendy-ipo-bot@users.noreply.github.com"
          git add data/mf data/market
          if ! git diff --cached --quiet; then
            git commit -m "markets: new data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git checkout -- .
            git pull --rebase -X theirs -q origin main
            git push
          fi
