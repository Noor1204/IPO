name: Live market snapshot

# Near-live NSE snapshot (indices, ~500 stocks) about every 100 seconds during Indian market hours. NOT real-time ticks.
# A run: fetch -> validate -> publish the files as ONE orphan commit force-pushed to the branch "live" (so the repo never grows)
#        -> purge jsDelivr -> wait until ~100 s after the run started -> start the next run itself (self-restarting chain, like refresh.yml).
# GitHub's own cron is only a kick-off in case the chain stopped (a failed run, a GitHub hiccup). Details: docs/LIVE.md
# This file must be on the default branch for the schedule and for `gh workflow run` to work.
on:
  schedule:
    - cron: "*/20 3-10 * * 1-5"      # 03:00-10:40 UTC = 08:30-16:10 IST, Mon-Fri; the first step exits quietly outside 09:00-15:50 IST
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/live.yml", "pipeline/live.mjs"]     # pushing a change to the live job starts it once (it exits quietly outside market hours)

permissions: {}

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write                # force-push the branch "live"
      actions: write                 # start the next run of this same workflow
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remember the start time and check the market window (IST)
        id: gate
        run: |
          echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"
          dow=$(TZ=Asia/Kolkata date +%u)                     # 1 = Monday ... 7 = Sunday
          hm=$(TZ=Asia/Kolkata date +%H%M)
          echo "IST now: $(TZ=Asia/Kolkata date '+%a %Y-%m-%d %H:%M:%S'), dow=$dow hm=$hm"
          if [ "$dow" -le 5 ] && [ "$((10#$hm))" -ge 900 ] && [ "$((10#$hm))" -le 1550 ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Outside Mon-Fri 09:00-15:50 IST: nothing to do (the chain ends here)."
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.go == 'yes'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.go == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # the previous snapshot (branch "live") is used for the row-count / time checks, the expiry cache AND intraday.json (today's price points, which the run
      # appends to). It may not exist yet (first run ever). If the branch exists but cannot be cloned (network hiccup), this run is skipped (skip=yes):
      # building without it would publish a one-point intraday.json and wipe the points collected so far; the next run, ~100 s later, tries again.
      - name: Fetch the previous snapshot
        id: prev
        if: steps.gate.outputs.go == 'yes'
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          rm -rf _prev
          for i in 1 2 3; do
            if git clone --quiet --depth 1 --branch live "$url" _prev; then break; fi
            rm -rf _prev; sleep $((i * 3))
          done
          if [ -d _prev ]; then
            echo "previous snapshot cloned: $(ls _prev | xargs)"
            echo "skip=no" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads "$url" live >/dev/null 2>&1; then
            echo "::warning::Branch live exists but could not be cloned; skipping this run so intraday.json is not reset."
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "no previous snapshot (first run ever)"
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      # exit code 3 = the fetch or the validation refused: nothing was written, the previous snapshot stays. Never fails the job.
      - name: Fetch NSE and build the snapshot
        if: steps.gate.outputs.go == 'yes' && steps.prev.outputs.skip != 'yes'
        run: |
          rm -rf _live
          prev=""; [ -f _prev/meta.json ] && prev="_prev"
          set +e
          LIVE_OUT=_live LIVE_PREV="$prev" node pipeline/live.mjs 2>&1 | tee live.log
          code=${PIPESTATUS[0]}
          set -e
          echo "live.mjs exit code: $code"
          if [ "$code" -ne 0 ] || [ ! -f _live/meta.json ]; then
            echo "::warning::No new snapshot this time (exit code $code); keeping the previous one."
            rm -rf _live
            # leave a readable reason on the branch live-status (the Actions log needs a login to read)
            rm -rf _diag; mkdir -p _diag
            tail -c 8000 live.log > _diag/log.txt || true
            echo "{\"ok\":false,\"exit\":$code,\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > _diag/status.json
            ( cd _diag && git init --quiet -b live-status && git config user.name "trendy-ipo-bot" && git config user.email "trendy-ipo-bot@users.noreply.github.com" && git add -A && git commit --quiet -m "live fetch failed" && git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/live-status ) || echo "could not write the diagnostic"
          fi

      - name: Publish to the branch live
        if: steps.gate.outputs.go == 'yes'
        run: |
          if [ ! -f _live/meta.json ]; then echo "Nothing to publish."; exit 0; fi
          cd _live
          git init --quiet -b live
          git config user.name "trendy-ipo-bot"
          git config user.email "trendy-ipo-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "live snapshot $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/live
          echo "published:"; ls -l

      # jsDelivr caches files for a long time; its purge API clears one file per call (https://purge.jsdelivr.net/gh/<owner>/<repo>@<branch>/<file>)
      - name: Purge the jsDelivr cache
        if: steps.gate.outputs.go == 'yes'
        continue-on-error: true
        run: |
          [ -f _live/meta.json ] || { echo "Nothing was published."; exit 0; }
          for f in meta.json market.json intraday.json; do
            curl -s -m 15 -o /dev/null -w "purge $f: HTTP %{http_code}\n" "https://purge.jsdelivr.net/gh/${{ github.repository }}@live/$f" || true
          done

      # wait until ~100 s after this run started, then start the next run (only while still inside market hours)
      - name: Wait, then start the next run
        if: always() && steps.gate.outputs.go == 'yes'
        run: |
          elapsed=$(( $(date +%s) - START_TS ))
          wait=$(( 100 - elapsed ))
          if [ "$wait" -lt 0 ]; then wait=0; fi
          echo "run took ${elapsed}s, sleeping ${wait}s"
          sleep "$wait"
          dow=$(TZ=Asia/Kolkata date +%u)
          hm=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$dow" -le 5 ] && [ "$((10#$hm))" -ge 900 ] && [ "$((10#$hm))" -le 1550 ]; then
            gh workflow run live.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
          else
            echo "Market window is over (IST $hm): the chain stops here."
          fi
