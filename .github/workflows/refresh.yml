name: Refresh data and publish site

# GitHub's own schedule only starts a run every 2-5 hours, so while an IPO is open (or opens within a day) the last job of every run waits a few minutes and starts the
# next run itself (a refresh about every 12 minutes, free). When no IPO is open the chain stops and the hourly schedule / a push from your PC takes over.
# Also runs whenever fresh data is pushed from your PC (scripts/push-data.cmd).
# Each run: fetch live data (NSE, BSE, GMP, SEBI, Yahoo), rebuild data/ipos.json, check it, commit it and publish the site on GitHub Pages.
# Company fundamentals (the score) are extracted on your own computer (needs your Claude login) and committed under data/fundamentals/.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["data/ipos.json", "data/verify.json", "data/fundamentals/**", "data/logos/**", "index.html", "style.css", "app.js", "boot.js", "sw.js", "manifest.webmanifest", "icons/**", "pipeline/**", ".github/workflows/**"]

# no permissions by default; each job asks only for what it needs
permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # to commit the refreshed data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remember the last published data
        run: cp data/ipos.json data/_prev.json
      # a source that is down (or blocks the runner) must not stop the others: the last good file stays in the repo
      - name: NSE
        continue-on-error: true
        env: { SKIP_DOCS: "1" }
        run: node pipeline/fetch-nse.mjs
      - name: BSE
        continue-on-error: true
        run: node pipeline/fetch-bse.mjs --no-docs
      - name: GMP
        continue-on-error: true
        run: node pipeline/gmp.mjs
      - name: SEBI
        continue-on-error: true
        run: node pipeline/sebi.mjs
      - name: Offer-document links
        continue-on-error: true
        timeout-minutes: 3          # this step downloads big PDFs from SEBI; the first run took 6 minutes, so it is capped
        run: node pipeline/offerdocs.mjs
      - name: Yahoo quotes
        continue-on-error: true
        run: node pipeline/quotes.mjs
      # verify.mjs is NOT run here: it compares figures with the offer-document text, which only exists on your computer.
      # The committed data/verify.json (from your last local run) is used as it is.
      - name: Build
        run: node pipeline/build.mjs
      # if the data looks wrong (garbage, markup, unknown links, impossible numbers) this step fails and nothing below runs:
      # the last good data stays in the repository and on the site
      - name: Check the data
        run: node pipeline/validate.mjs data/_prev.json
      - name: Commit data
        run: |
          git config user.name "trendy-ipo-bot"
          git config user.email "trendy-ipo-bot@users.noreply.github.com"
          git add data/ipos.json data/gmp.json data/sub-history.json data/quotes.json data/sebi.json data/bse.json data/nse.json data/nse-history.json data/offer-docs.json data/fundamentals data/logos data/logos.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
            git fetch -q origin main
            # Only if the PC pushed in the meantime is there anything to merge. Merging two versions of ipos.json can mix them up,
            # so after a merge it is built again in one piece and checked again (a failure stops here and nothing is pushed).
            if [ "$(git rev-parse origin/main)" != "$(git merge-base HEAD origin/main)" ]; then
              git pull --rebase -X theirs origin main
              node pipeline/build.mjs
              node pipeline/validate.mjs data/_prev.json
              git add data/ipos.json
              git diff --cached --quiet || git commit -m "data: rebuilt after merge"
            fi
            git push
          fi
      - name: Build site
        run: node pipeline/make-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write             # publish to GitHub Pages
      id-token: write          # proves to Pages that this run is the one publishing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # keeps the refresh going every ~12 minutes while an IPO is live (or opens today / tomorrow); sleeps, then starts the next run
  next:
    needs: [build, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write            # only to start the next run of this same workflow
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is an IPO open?
        id: live
        run: |
          if node -e '
            const ist = d => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata" }).format(d);
            const today = ist(new Date()), tomorrow = ist(new Date(Date.now() + 864e5));
            const j = JSON.parse(require("fs").readFileSync("data/ipos.json", "utf8"));
            const hit = (j.ipos || []).filter(i => (i.status === "live" && i.close >= today) || (i.open && i.open >= today && i.open <= tomorrow));
            console.log(hit.length + " IPO(s) open or opening soon");
            process.exit(hit.length ? 0 : 1);
          '; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - name: Wait, then start the next run
        if: steps.live.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 420
          gh workflow run refresh.yml --ref main
