<body><style>
html:has(#splash){overflow:hidden}
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 42%,#4458d8 0%,#232d86 50%,#0d1247 100%);color:#fff;transition:opacity .6s ease,transform .6s ease}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
/* rising gold sparks in the background */
#splash .fx{position:absolute;inset:0;pointer-events:none}
#splash .fx i{position:absolute;bottom:-12px;width:6px;height:6px;border-radius:50%;background:#fbbf24;opacity:0;box-shadow:0 0 10px 2px rgba(251,191,36,.7);animation:sp-rise 3.2s ease-in infinite}
/* shock rings behind the logo */
#splash .wave{position:absolute;left:50%;top:42%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(251,191,36,.7);opacity:0;animation:sp-wave 1.5s ease-out forwards}
#splash .w2{animation-delay:.12s;border-color:rgba(165,180,252,.7)}
#splash .logo-wrap{position:relative;width:168px;height:168px;display:grid;place-items:center;animation:sp-float 2.6s ease-in-out 1.6s infinite}
#splash .logo-wrap::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.38),rgba(251,191,36,0) 65%);opacity:0;animation:sp-glow 1.2s ease-out 1.5s forwards}
#splash svg{width:156px;height:156px;overflow:visible;filter:drop-shadow(0 14px 30px rgba(0,0,0,.45));position:relative}
#splash .tile{transform-box:fill-box;transform-origin:center;animation:sp-drop .85s cubic-bezier(.2,1.5,.35,1) both}
#splash .spbar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:sp-grow .6s cubic-bezier(.2,1.1,.3,1.25) forwards}
#splash .b1{animation-delay:.55s}#splash .b2{animation-delay:.72s}#splash .b3{animation-delay:.89s}
#splash .ln{stroke-dasharray:100;stroke-dashoffset:100;animation:sp-draw .75s cubic-bezier(.5,0,.2,1) 1.15s forwards}
#splash .lns{stroke-dasharray:100;stroke-dashoffset:100;animation:sp-draw .75s cubic-bezier(.5,0,.2,1) 1.15s forwards}
#splash .arrow{transform-box:fill-box;transform-origin:30% 50%;transform:scale(0);animation:sp-pop .45s cubic-bezier(.2,1.9,.4,1) 1.78s forwards}
#splash .star{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:sp-star 1s cubic-bezier(.2,1.6,.4,1) 1.95s forwards,sp-twinkle 1.6s ease-in-out 3s infinite}
#splash .shine{animation:sp-shine .9s ease-in-out 2.05s both}
#splash h1{margin:30px 0 6px;font:800 36px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.4px;display:flex;position:relative}
#splash h1 span{display:inline-block;opacity:0;transform:translateY(18px) scale(.8);filter:blur(6px);animation:sp-letter .5s cubic-bezier(.2,1.2,.4,1) forwards}
#splash h1 .gold{color:#fbbf24;font-size:1.3em;font-weight:900;line-height:.9;-webkit-text-stroke:1px #d97706;text-shadow:0 3px 0 rgba(120,53,15,.4),0 0 22px rgba(251,191,36,.75);animation:sp-letter .5s cubic-bezier(.2,1.2,.4,1) forwards,ipo-hue 3.5s linear infinite}
#splash .spline{display:block;height:3px;width:0;margin:6px 0 10px;border-radius:3px;background:linear-gradient(90deg,transparent,#fbbf24,transparent);animation:sp-line .7s ease-out 2.75s forwards}
#splash p{margin:0;font:600 12.5px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:2.2px;opacity:0;transform:translateY(8px);animation:sp-fade .6s ease 2.85s forwards;color:#c7d2fe;text-transform:uppercase}
@keyframes sp-drop{0%{transform:translateY(-150px) scale(.5) rotate(-18deg);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
@keyframes sp-grow{to{transform:scaleY(1)}}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
@keyframes sp-star{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
@keyframes sp-twinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@keyframes sp-shine{0%{transform:translateX(-140px)}100%{transform:translateX(140px)}}
@keyframes sp-wave{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(4)}}
@keyframes sp-glow{0%{opacity:0;transform:scale(.6)}60%{opacity:1}100%{opacity:.75;transform:scale(1)}}
@keyframes sp-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sp-rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-105vh) scale(1.2)}}
@keyframes ipo-hue{0%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(180deg) brightness(1.35)}100%{filter:hue-rotate(360deg) brightness(1)}}
@keyframes sp-letter{to{opacity:1;transform:none;filter:none}}
#splash .by{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font:600 12px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:1.4px;color:#a5b4fc;opacity:0;animation:sp-fade .7s ease 3.2s forwards}
#splash .by b{color:#fbbf24}
@keyframes sp-line{to{width:150px}}
@keyframes sp-fade{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *,#splash *::before{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
