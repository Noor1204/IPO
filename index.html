html:has(#splash){overflow:hidden}
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(60% 50% at 50% 38%,rgba(99,102,241,.38),transparent 70%),radial-gradient(50% 40% at 85% 90%,rgba(168,85,247,.28),transparent 70%),#070b1a;color:#fff;transition:opacity .28s ease,transform .28s ease}

#splash h1{margin:22px 0 4px;font:800 30px/1 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.5px;display:flex;position:relative}
#splash h1 span{display:inline-block;opacity:0;transform:translateY(10px);animation:sp-letter .3s ease forwards}
#splash h1 .gold{background:linear-gradient(90deg,#818cf8,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
#splash p{margin:0;font:600 12px Inter,system-ui,sans-serif;letter-spacing:2px;opacity:0;color:#a5b4fc;text-transform:uppercase;animation:sp-fade .4s ease .55s forwards}
#splash .by{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));font:600 12px Inter,system-ui,sans-serif;letter-spacing:1px;color:#818cf8;opacity:0;animation:sp-fade .4s ease .6s forwards}
#splash .by b{color:#c7d2fe}
@keyframes sp-in{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:none}}
@keyframes sp-glow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes sp-letter{to{opacity:1;transform:none}}
@keyframes sp-fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *,#splash *::before{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
